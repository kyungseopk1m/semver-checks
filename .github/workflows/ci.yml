name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package quality check
        run: npm run check

      # Dogfood: run semver-checks on itself against the last published release.
      # Deliberately NO --strict: this repo does ship majors, and gating on them
      # would block every PR on a major-prep branch. Without --strict the only
      # non-zero exit is 2 — a crash, an unresolvable entry, or a registry failure
      # — so the step is a real crash canary on the tool's own public API rather
      # than a bump gate. It does not, and should not, prevent a legitimate MAJOR.
      - name: Dogfood (self semver check)
        timeout-minutes: 5
        run: node bin/semver-checks.js compare semver-checks@latest .
