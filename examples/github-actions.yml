# Example: run semver-checks on every pull request.
#
# Copy this file into your library repository at .github/workflows/semver-check.yml
# (it lives under examples/ here so it does not run on the semver-checks repo itself).
#
# It compares the published `latest` release against the PR's working tree, so no
# git tags are required.

name: SemVer Check

on:
  pull_request:
    branches: [main]

# Allow the workflow to comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Option A: inline annotations on the PR "Files changed" view.
      # Replace `your-package` with your published package name.
      - name: Check for breaking changes
        uses: kyungseopk1m/semver-checks@v0.13.0
        with:
          old: "your-package@latest"
          new: "."
          format: "github"
          strict: "true" # fail the PR on a confident (proven) breaking change

      # Option B: check the bump this release declares, and post the verdict to
      # the PR as a single comment that is edited in place on every later push.
      # `declared: auto` reads the bump from `.changeset/*.md` and falls back to
      # the two `package.json` versions; the step fails when a release
      # understates a proven breaking change, and passes with a note when it
      # only understates an addition. Needs `pull-requests: write` above.
      # `token` defaults to `github.token`.
      #
      # Only one step per workflow should set `comment: true`: the comment is
      # edited in place per token identity, so a second one would overwrite the
      # first rather than sit beside it. Drop Option A if you use this.
      - name: Check the declared bump and comment it on the PR
        if: always()
        uses: kyungseopk1m/semver-checks@v0.13.0
        with:
          old: "your-package@latest"
          declared: "auto"
          comment: "true"
